name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-and-hooks:
    name: Skill, hook and plugin tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the PowerShell hook and Windows-style paths really get tested.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # Every runner has bash (Git Bash on Windows) and pwsh, so the hook tests cover both scripts.
      # bash expands the globs; Node 20 doesn't.
      - shell: bash
        run: node --test .github/skills/one-way-door/scripts/test/*.test.mjs .github/hooks/scripts/test/*.test.mjs tests/*.test.mjs

  services:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [settlement-service, ledger-service, reconciliation-batch, control-centre]
    defaults:
      run:
        working-directory: demo/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: demo/${{ matrix.service }}/pom.xml
      - run: ./mvnw -B test
