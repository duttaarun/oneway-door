# Northwind Payments demo stack. Start it with demo/scripts/up.sh, not directly:
# the app images (owd/*:live) are built from git refs by demo/scripts/deploy.sh.
name: one-way-door

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwind -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in payments.settled payments.settled.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 1 --replication-factor 1
        done
    restart: "no"

  settlement-service:
    image: owd/settlement-service:live
    pull_policy: never
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8081:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  ledger-service:
    image: owd/ledger-service:live
    pull_policy: never
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # Like a Kubernetes pod: a service that fails on start-up keeps restarting.
    restart: on-failure

  # Run on demand: docker compose run --rm reconciliation-batch
  reconciliation-batch:
    image: owd/reconciliation-batch:live
    pull_policy: never
    profiles: ["batch"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: demo/scripts/up.sh --ui, then http://localhost:8085
  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles: ["ui"]
    environment:
      KAFKA_CLUSTERS_0_NAME: northwind
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
